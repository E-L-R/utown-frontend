# Render's free tier sleeps the API after 15 idle minutes and a cold boot takes a minute or two.
# Pinging the health endpoint every 10 minutes keeps it awake at no cost.
# Note: one always-on free service uses ~744 of the 750 free instance hours Render gives a workspace
# each month, and GitHub pauses scheduled workflows after 60 days without repository activity.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health check
        run: curl --silent --show-error --output /dev/null --max-time 180 --retry 2 --write-out '%{http_code} in %{time_total}s\n' https://utown-backend.onrender.com/actuator/health
